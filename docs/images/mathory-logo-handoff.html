<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathory Logo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --mathory-red: #D97757; --mathory-red-dark: #BC5F3F; }
  body { margin: 0; background: #FAF9F7; font-family: 'Pretendard Variable', Pretendard, sans-serif; }
  .stage { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 72px; padding: 64px 24px; box-sizing: border-box; }
  .logo { font-size: 116px; font-weight: 600; color: var(--mathory-red); letter-spacing: -0.03em; line-height: 1; }
  .variants { display: flex; gap: 48px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .variant { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .variant .label { font-size: 13px; color: #8A8580; }
  .logo-sm { font-size: 40px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
  .on-dark { background: #1E1B18; padding: 28px 44px; border-radius: 16px; }
  .on-dark .logo-sm { color: var(--mathory-red); }
  .on-color { background: var(--mathory-red); padding: 28px 44px; border-radius: 16px; }
  .on-color .logo-sm { color: #fff; }
  .icon { background: #fff; border: 1px solid #EBE7E2; border-radius: 24px; width: 136px; height: 136px; display: flex; align-items: center; justify-content: center; }
  .icon span { font-size: 72px; font-weight: 600; color: var(--mathory-red); line-height: 1; }
</style>
</head>
<body>
<div class="stage">
  <div class="logo">Mathory</div>
  <div class="variants">
    <div class="variant"><div class="on-dark"><div class="logo-sm">Mathory</div></div><div class="label">어두운 배경</div></div>
    <div class="variant"><div class="on-color"><div class="logo-sm">Mathory</div></div><div class="label">컬러 배경 (반전)</div></div>
    <div class="variant"><div class="icon"><span>M</span></div><div class="label">앱 아이콘용 심볼</div></div>
  </div>
</div>
</body>
</html>
